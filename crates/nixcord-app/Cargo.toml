[package]
name = "nixcord"
description = "A lightweight native Discord client written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nixcord"
path = "src/main.rs"

[features]
default = ["video", "voice"]
# Inline video player (H.264 MP4/MOV). Adds about 0.7 MB to the release exe.
video = ["dep:nixcord-video"]
# Discord voice calls (Voice Gateway, AEAD RTP, cpal capture/playback).
voice = ["dep:nixcord-voice"]

[dependencies]
nixcord-model.workspace = true
nixcord-gateway.workspace = true
nixcord-http.workspace = true
nixcord-store.workspace = true
nixcord-markdown.workspace = true
nixcord-media.workspace = true
nixcord-emoji.workspace = true
# Inline video playback (OpenH264 + symphonia + cpal); `--no-default-features` drops it.
nixcord-video = { workspace = true, optional = true }
# Discord voice calls; `--no-default-features` drops it.
nixcord-voice = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "persistence", "clipboard", "links", "wayland", "x11"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
keyring = "4.2"
serde.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Native save dialog for the image viewer (Win32 / AppKit / XDG portal; no GTK).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Clipboard image paste (Ctrl+V) in the composer, encoded to PNG in memory.
arboard = "3.7"
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Renderer per OS (see src/platform.rs): wgpu on Direct3D 12 only on Windows (no
# Vulkan/GL/Metal wgpu backends compiled in), with glow kept as a fallback for machines
# whose D3D12 driver fails; OpenGL (glow) elsewhere.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features", "glow"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow"] }
