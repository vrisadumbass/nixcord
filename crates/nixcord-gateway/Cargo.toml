[package]
name = "nixcord-gateway"
description = "Discord gateway websocket client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nixcord-model.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# tokio-tungstenite builds rustls with no crypto provider. Use aws-lc-rs, the same provider
# reqwest's `rustls` feature uses, so only one crypto backend is compiled; it is installed
# as the process default at startup.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
