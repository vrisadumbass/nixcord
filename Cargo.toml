[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vrisadumbass/nixcord"

[workspace.dependencies]
nixcord-model = { path = "crates/nixcord-model" }
nixcord-gateway = { path = "crates/nixcord-gateway" }
nixcord-http = { path = "crates/nixcord-http" }
nixcord-store = { path = "crates/nixcord-store" }
nixcord-markdown = { path = "crates/nixcord-markdown" }
nixcord-media = { path = "crates/nixcord-media" }
nixcord-emoji = { path = "crates/nixcord-emoji" }
nixcord-video = { path = "crates/nixcord-video" }
nixcord-voice = { path = "crates/nixcord-voice" }
nixcord-capture = { path = "crates/nixcord-capture" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# Size-optimized: ~4 MB smaller exe than opt-level 3 with no measurable memory change.
# The hot per-frame paths (tessellation, text layout) stay at full speed below.
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.epaint]
opt-level = 3

[profile.release.package.egui]
opt-level = 3
