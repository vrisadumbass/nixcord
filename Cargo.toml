[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nixxane/nixcord"

[workspace.dependencies]
nixcord-model = { path = "crates/nixcord-model" }
nixcord-gateway = { path = "crates/nixcord-gateway" }
nixcord-http = { path = "crates/nixcord-http" }
nixcord-store = { path = "crates/nixcord-store" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
